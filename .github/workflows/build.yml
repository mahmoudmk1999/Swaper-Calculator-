name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o "$(ls *.zip | head -1)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: calculator
        run: |
          npm ci
          npx expo prebuild --platform android --no-install --clean
          cd android && chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../../Swaper-Calculator.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Swaper Calculator ${{ github.run_number }}
          files: Swaper-Calculator.apk
